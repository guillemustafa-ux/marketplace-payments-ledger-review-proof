name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: "verify (${{ matrix.os }}, node 22)"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Hosted Windows runners run as an administrator, and Postgres refuses to start under an
      # administrator account, so embedded-postgres cannot run there. Use the runner's own
      # PostgreSQL service instead (user postgres, password root, per the runner image readme).
      - name: Start the runner's PostgreSQL (Windows only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $service = Get-Service -Name 'postgresql*' | Select-Object -First 1
          Set-Service -Name $service.Name -StartupType Manual
          Start-Service -Name $service.Name
          "DATABASE_URL=postgres://postgres:root@127.0.0.1:5432/postgres" >> $env:GITHUB_ENV
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run review
      - run: git diff --exit-code
      - run: npm run footgun -- --all
